name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run classic pipeline on sample data
        run: python run_classic.py --data data/sample_feedback.csv --supervised --out outputs
      - uses: actions/upload-artifact@v4
        with:
          name: classic-outputs
          path: outputs/

  embeddings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only PyTorch and embedding dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-embeddings.txt
      - name: Run embedding pipeline on sample data
        run: python run_embeddings.py --data data/sample_feedback.csv --out outputs
      - uses: actions/upload-artifact@v4
        with:
          name: embedding-outputs
          path: outputs/

  publish-outputs:
    # Commit the example charts produced above so the README can show them.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests, embeddings]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Commit updated example outputs
        run: |
          mkdir -p outputs
          cp artifacts/classic-outputs/*.png artifacts/classic-outputs/summary.json outputs/
          cp artifacts/embedding-outputs/*.png artifacts/embedding-outputs/*.txt outputs/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update example outputs from CI [skip ci]"
          git push
