name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Run classic pipeline on sample data
        run: python run_classic.py --data data/sample_feedback.csv --supervised --out outputs
      - uses: actions/upload-artifact@v4
        with:
          name: classic-outputs
          path: outputs/

  embeddings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only PyTorch and embedding dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-embeddings.txt
      - name: Run embedding pipeline on sample data
        run: python run_embeddings.py --data data/sample_feedback.csv --out outputs
      - uses: actions/upload-artifact@v4
        with:
          name: embedding-outputs
          path: outputs/
